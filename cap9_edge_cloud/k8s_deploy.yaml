# Full Kubernetes manifests for Mission Data Grid
# Deploy: kubectl apply -f k8s_deploy.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: mission-grid
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mission-config
  namespace: mission-grid
data:
  KAFKA_BOOTSTRAP: "kafka-service:9092"
  REDIS_URL: "redis://redis-service:6379"
  COSMOS_API_URL: "http://cosmos-service:8001"
  VSS_API_URL: "http://vss-service:8000"
  THREAT_THRESHOLD: "0.75"
  CORRELATION_WINDOW_SEC: "60"
---
# ── DeepStream Edge Node ──────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: deepstream-edge
  namespace: mission-grid
spec:
  selector:
    matchLabels:
      app: deepstream-edge
  template:
    metadata:
      labels:
        app: deepstream-edge
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
        node-role: "edge-camera"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: deepstream
          image: nvcr.io/nvidia/deepstream:8.0-gc-triton-devel
          command: ["python3", "/workspace/mv3dt_pipeline.py"]
          envFrom:
            - configMapRef:
                name: mission-config
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvidia-api-secret
                  key: api-key
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: models
              mountPath: /models
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: workspace
          configMap:
            name: deepstream-config
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
# ── Mission Grid (Cloud) ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-grid
  namespace: mission-grid
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission-grid
  template:
    metadata:
      labels:
        app: mission-grid
    spec:
      containers:
        - name: mission-grid
          image: your-registry/mission-grid:latest
          command: ["python3", "mission_grid.py"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: mission-config
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "4"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mission-grid-service
  namespace: mission-grid
spec:
  selector:
    app: mission-grid
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
---
# ── VSS Agent (Cloud GPU) ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vss-agent
  namespace: mission-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vss-agent
  template:
    metadata:
      labels:
        app: vss-agent
    spec:
      containers:
        - name: vss-agent
          image: your-registry/vss-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mission-config
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvidia-api-secret
                  key: api-key
          resources:
            limits:
              memory: "8Gi"
              cpu: "4"
---
# ── Dashboard ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: mission-grid
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: your-registry/mission-dashboard:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mission-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: mission-grid
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer